name: Nặn File IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Tải công cụ phụ trợ (Carthage)
        run: ./Scripts/bootstrap.sh -d

      - name: Máy chủ Mac bắt đầu nung code
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build

      - name: Đóng gói thành file IPA
        run: |
          mkdir Payload
          cp -r ./build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app Payload/
          zip -r WebDriverAgentRunner.ipa Payload

      - name: Nhả file IPA cho sếp tải
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner_Cho_3uTools
          path: WebDriverAgentRunner.ipa
